name: Verify font
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/design.py
      - run: python scripts/build.py
      - run: python scripts/audit.py
      - run: python scripts/specimen.py
      - run: python scripts/verify.py
      - run: python scripts/verify_geometry.py
      - run: python scripts/verify_spacing.py
      - run: sha256sum outputs/LUNARSERIFJP-Regular.ttf outputs/LUNARSERIFJP-Regular.woff2 > /tmp/lunar-jp.sha256
      - run: python scripts/build_jp.py
      - run: sha256sum --check /tmp/lunar-jp.sha256
      - run: python scripts/verify_jp.py --harfbuzz-python python
      - run: python scripts/jp_reference.py
